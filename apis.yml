aid: leap
name: Leap
description: 'Leap is a San Francisco-based energy software company that lets technology brands build
  and scale virtual power plants (VPPs). Its platform aggregates distributed energy resources — residential
  and commercial battery storage, smart thermostats and heat pumps, and EV charging — and gives them a
  single point of integration into wholesale electricity markets and utility grid-service programs across
  CAISO, NYISO and other regions. Leap exposes a universal REST API covering meter onboarding and bulk
  creation, utility data authorization (Leap Connect), enrollment and participation management, market
  nominations and bidding, real-time dispatch delivery over webhooks or polling, event performance and
  interval data, and revenue settlement reporting. Partners authenticate with environment-scoped bearer
  API keys against separate staging and production hosts, and Leap publishes OpenAPI definitions, a dated
  changelog, an llms.txt index and a public status page.'
