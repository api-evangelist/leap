summary: The Leap domain graph centres on the Meter — the unit of inventory that provides grid services.
  A meter belongs to a partner account, carries a customer, a site, one or more devices and a utility
  service account, holds an enrollment in one or more market programs, is nominated into market delivery
  periods, receives dispatch timeslots individually or as part of a market group, and settles into periodic
  revenue aggregations. Leap identifiers are opaque UUID-style strings with no documented type prefixes.
identifiers:
  meter_id: Leap-assigned meter identifier; the primary key across every service. Also appears as meter_uuid
    on the dispatch communication-test request.
  partner_reference: Partner-supplied identifier attached to a meter and echoed on dispatch events, webhook
    payloads and revenue aggregations; the join key between Leap and partner systems.
  job_id: Identifier for an asynchronous meter batch-creation job.
  webhook_id: Identifier for a webhook subscription.
  nomination_suggestion_id: Identifier for a nomination suggestion on a meter.
  market_group_id: Identifier for a market group (a set of meters dispatched together).
  program_identifier: Identifier for a market or utility program a meter is enrolled in.
  prefixes: none published — Leap does not document type-prefixed identifiers.
