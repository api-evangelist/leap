      description: Billing address for the customer.
      example:
        street_1: 132 My Billing Street
        street_2: Apartment 32
        postal_code: '90210'
        city: Los Angeles
        state_or_province_code: CA
        country_code: US
      properties:
        street_1:
          description: Physical street of the billing address. If you need to provide extensions like apartment or unit number, please add those to the 'street2' field.
          example: 132 My Billing Street
          maxLength: 128
          minLength: 1
          pattern: ^[’'+#"@()/&.,;\sA-Za-zÀ-ɏḀ-ỿ0-9\-\\|]{1,128}$
          type: string
        street_2:
          description: Provide extensions like apartment or unit number here if needed.
          example: Apartment 32
          maxLength: 128
          minLength: 1
          pattern: ^[’'+#"@()/&.,;\sA-Za-zÀ-ɏḀ-ỿ0-9\-\\|]{1,128}$
          type: string
        postal_code:
          description: Billing address postal code.
          example: '90210'
          pattern: ^[0-9]{5}(?:-[0-9]{4})?$
          type: string
        city:
          description: Billing address city.
          example: Los Angeles
          maxLength: 128
          minLength: 1
          pattern: ^[’'+#"@()/&.,;\sA-Za-zÀ-ɏḀ-ỿ0-9\-]{1,128}$
          type: string
        state_or_province_code:
          description: Billing address state or province code.
          example: CA
          maxLength: 2
          minLength: 2
          type: string
        country_code:
          default: US
          description: ISO 3166-1 alpha-2 country code of the billing address country. Defaults to US.
          example: US
          maxLength: 2
          minLength: 2
          type: string
      required:
      - city
      - country_code
      - postal_code
      - state_or_province_code
      - street_1
      type: object
