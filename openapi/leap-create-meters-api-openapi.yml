            voltage: '>= 600 V'
            utility_meter_serial_number: utility-meter-serial-number
          customer_group: customer_group
    MeterType:
      description: The type of asset.
      enum:
      - UTILITY_METER
      - SUBMETER
      - DEVICE
      type: string
    CustomerClassification:
      description: Whether this is a residential (home) asset or a commercial (business) asset.
      enum:
      - RESIDENTIAL
      - COMMERCIAL
      type: string
    customer_baseline_load_verification_methodology:
      description: Choice of the Customer Baseline Load (CBL) verification methodology that will be used to calculate load reduction.
      enum:
      - AVERAGE_DAY
      - WEATHER_ADJUSTED
      type: string
    CreateMeterCustomerGroup:
      properties:
        customer_group:
          description: The customer group associated with the meter.
          pattern: ^[’'+#\"@()/&.,;A-Za-z\u00C0-\u024F\u1E00-\u1EFF0-9\s_\-]{0,128}$
          type: string
    CreateAssetRequest:
      example:
        onboarding_token: eyJleGFtcGxlIjoiWW91IHNwZW50IHdheSB0b28gbXVjaCB0aW1lIGludG8gdGhpcyIsImluZm8iOiJMZWFwIHdpbGwgcHJvdmlkZSB0aGUgdG9rZW4ifQ.eyJleGFtcGxlIjoiWW91IHNwZW50IHdheSB0b28gbXVjaCB0aW1lIGludG8gdGhpcyIsImluZm8iOiJMZWFwIHdpbGwgcHJvdmlkZSB0aGUgdG9rZW4ifQ.eyJleGFtcGxlIjoiWW91IHNwZW50IHdheSB0b28gbXVjaCB0aW1lIGludG8gdGhpcyIsImluZm8iOiJMZWFwIHdpbGwgcHJvdmlkZSB0aGUgdG9rZW4ifQ
        provisional_asset:
          partner_reference: unique-reference-id-12345
          transmission_region: CAISO
          customer_classification: RESIDENTIAL
          load_types:
          - HVAC
          meter_type: UTILITY_METER
          customer:
            street_1: 132 My Street
            street_2: Apartment 32
            postal_code: '10001'
            city: New York
            state_or_province_code: NY
            country_code: US
            end_customer_name: Customer Name
            end_customer_title: Mrs.
            end_customer_email: email@address.com
            end_customer_phone_number: (123) 123-4567
            end_customer_company_name: Company Name Inc.
