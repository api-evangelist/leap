    MeterIdentifiers:
      allOf:
      - $ref: "#/components/schemas/MeterId"
      - $ref: "#/components/schemas/AssetIdentifiers"
      - $ref: "#/components/schemas/ExtendedMeterIdentifiers"
      required:
      - is_archived
