    MeterId:
      properties:
        meter_id:
          description: The unique identifier for the meter.
          example: 11111111-1111-1111-1111-111111111111
          format: uuid
          type: string
    AssetIdentifiers:
      properties:
        partner_reference:
          allOf:
          - $ref: "#/components/schemas/PartnerReference"
          description: The partner-supplied reference ID to help identify the customer
            or site that a Leap meter correlates to a partner’s internal systems.
          example: unique-reference-id-12345
          type: string
        transmission_region:
          $ref: "#/components/schemas/transmission_region"
        customer_classification:
          $ref: "#/components/schemas/CustomerClassification"
        load_types:
          description: The partner-controlled and curtailable assets associated with
            the meter. Multiple load types per meter are supported.
          example:
          - HVAC
          items:
            $ref: "#/components/schemas/load_type"
          minItems: 1
          type: array
        meter_type:
          $ref: "#/components/schemas/MeterType"
    ExtendedMeterIdentifiers:
      properties:
        connection_references:
          description: "List of connection reference IDs, which are the refIDs supplied\
            \ during completed Leap Connect authorizations.  A meter may have multiple\
            \ connection reference IDs if multiple people authorized the same meter\
            \ or a single person authorized a meter multiple times with different\
            \ reference IDs each time."
          items:
            allOf:
            - $ref: "#/components/schemas/PartnerReference"
            example: connection-reference-id-1
            type: string
          type: array
          uniqueItems: true
        customer_group:
          description: The customer group associated with the meter.
          pattern: "^[’'+#\\\"@()/&.,;A-Za-z\\u00C0-\\u024F\\u1E00-\\u1EFF0-9\\s_\\\
            -]{0,128}$"
          type: string
        tags:
          description: Tags set by partner or Leap to help group and identify meters
          items:
            pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-|\\\\]{1,128}$"
            type: string
          type: array
        is_archived:
          description: Whether the meter is archived
          type: boolean
