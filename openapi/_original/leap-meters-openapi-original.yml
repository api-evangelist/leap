            \ field."
          example: 132 My Street
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-|\\\\]{1,128}$"
          type: string
        street_2:
          description: Provide extensions like apartment or unit number here.
          example: Apartment 32
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-|\\\\]{1,128}$"
          type: string
        postal_code:
          description: Postal code of the location this asset is located in.
          example: "10001"
          pattern: "^[0-9]{5}(?:-[0-9]{4})?$"
          type: string
        city:
          description: City this asset is located in.
          example: New York
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-]{1,128}$"
          type: string
        state_or_province_code:
          description: State or province this asset is located in.
          example: NY
          maxLength: 2
          minLength: 2
          type: string
        country_code:
          default: US
          description: ISO 3166-1 alpha-2 country code of the country this asset is
            located in.
          example: US
          maxLength: 2
          minLength: 2
          type: string
        end_customer_name:
          description: End customer name or contact name
          example: Customer Name
          maxLength: 128
          minLength: 1
          pattern: "^(?!.*[�\\u00A0\\uFFFD?])[\\s\\S]{1,128}$"
          type: string
        end_customer_title:
          description: Title of the primary contact for the end customer; only applicable
            for Commercial & Industrial customers
          example: Mrs.
          maxLength: 15
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-]{1,128}$"
          type: string
        end_customer_email:
          description: The customer email address
          example: email@address.com
          format: email
          maxLength: 128
          minLength: 3
          type: string
        end_customer_phone_number:
          description: "This would ideally be the phone number on file with the LSE;\
            \ it may be used by the CEC and/or Utility Distribution Company (UDC)\
            \ for verification purposes; please do not use any special characters\
            \ for this column, and do not include a \"1\" at the front of the phone\
            \ number."
          example: (123) 123-4567
          maxLength: 32
          minLength: 3
          type: string
        end_customer_company_name:
          description: Legal company name of the end customer site; only applicable
            for Commercial & Industrial customers
          example: Company Name Inc.
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-]{1,128}$"
          type: string
        partner_offering_name:
          description: 'The name of Partner''s program/offering in which the end-customer
            enrolled/contracted. '
          example: Offering Name
          maxLength: 128
          minLength: 1
          type: string
        partner_offering_date:
          description: Date in which the end customer enrolled in Partner's offering
          format: date
          type: string
        is_in_wholesale_capacity_market:
          description: Forward Capacity Market in ISONE
          type: boolean
        dispatch_option:
          $ref: "#/components/schemas/DispatchOption"
        billing:
          $ref: "#/components/schemas/Customer_billing"
        partner_customer_reference:
          description: Partner identifier for customer or site. This should match
            the refId used in Leap Connect when combining  customer-supplied data
            in Leap Connect with partner-supplied data in Create Meters/Meter Uploads.
          example: partner-customer-reference-1
          maxLength: 256
          minLength: 3
          pattern: "^[^\\/\\\\?\\]\\[{}!#$%^&*()<>|]{3,256}$"
          type: string
      required:
      - city
      - country_code
      - postal_code
      - state_or_province_code
      - street_1
      type: object
