      properties:
        cbl_method:
          $ref: "#/components/schemas/customer_baseline_load_verification_methodology"
        company_type:
          $ref: "#/components/schemas/company_type"
        existing_nyiso_resource_id:
          description: "If the meter has previously been enrolled in SCR, they have\
            \ had a resource_id assigned to it by NYISO"
          example: "666266"
          type: string
        partner_nyiso_resource_name:
          description: "If the meter has previously been enrolled in SCR, they have\
            \ had a resource_id assigned to it by partner"
          example: "666266"
          type: string
      type: object
    ReadUtility:
      properties:
        utility:
          $ref: "#/components/schemas/ReadUtility_utility"
    CommonUtility:
      properties:
        utility_name:
          $ref: "#/components/schemas/utility"
        load_serving_entity:
          description: The utility or community choice aggregator that the customer
            buys electricity from
          example: PGE
          maxLength: 128
          minLength: 1
          type: string
        electric_service_account_number:
          description: "This is also known as Service Agreement ID or Service Account\
            \ Number, depending on utility in CAISO, Electric Account Number in ISO-NE,\
            \ ESIID in ERCOT, or TO Account Number in NYISO."
          example: 12243243-121
          maxLength: 128
          minLength: 1
          type: string
        tariff:
          description: "The tariff or electric rate code can be found on the electric\
            \ bill. For California DSGS, virtual net energy metering storage assets\
            \ must indicate 'VNEM'."
          example: tariff code
          maxLength: 128
          minLength: 1
          type: string
        voltage:
          description: "Transmission Owner voltage service level description (e.g.,\
            \ High tension, Transmission, Primary) or range (e.g., >= 600 V, < 35kV).While\
            \ this information is required for customers enrolling in NYISO SCR, Leap\
            \ is usually able to identify the TO service voltage level for the site."
          example: '>= 600 V'
          maxLength: 128
          minLength: 1
          type: string
        utility_meter_serial_number:
          description: Serial number of the electricity meter
          example: utility-meter-serial-number
          maxLength: 256
          minLength: 1
          type: string
      type: object
    AuditInfo:
      properties:
        audit:
          $ref: "#/components/schemas/AuditInfo_audit"
    transmission_region:
      description: Defines the transmission region of the meter
      enum:
      - CAISO
      - ERCOT
      - NYISO
      - ISONE
      - PJM
      - SERC
      - WECC_SW
      - WECC_PC
      example: CAISO
      type: string
    CustomerClassification:
      description: Whether this is a residential (home) asset or a commercial (business)
        asset.
      enum:
      - RESIDENTIAL
      - COMMERCIAL
      type: string
    PartnerReference:
      description: The partner-supplied reference ID to help identify the customer
        or site that a Leap meter correlates to a partner’s internal systems.
      example: partner-reference-1
      maxLength: 256
      minLength: 3
      pattern: "^[^\\/\\\\?\\]\\[{}!#$%^&*()<>|]{3,256}$"
      type: string
    EnrollmentStatus:
      description: The enrollment status of the meter.
      enum:
      - ACTIVE
      - ELIGIBLE
      - INELIGIBLE
      - NOT_PARTICIPATING
      - PENDING
      example: ACTIVE
      type: string
    MeterType:
      description: The type of asset.
      enum:
      - UTILITY_METER
      - SUBMETER
      - DEVICE
      type: string
    load_type:
      description: The load type of the device
      enum:
      - HVAC
      - EV_CHARGING
      - BATTERY_STORAGE
      - COLD_STORAGE
      - PUMPING
      - WATER_HEATING
      - BUILDING_AUTOMATION
      - GENERATION
      - MANUFACTURING
      - LIGHTING
      - OTHER
      example: HVAC
      type: string
    action_type:
      description: The type of action required to participate with this meter.
      enum:
      - IS_AUTHORIZED
      - DOCUMENTS_SIGNED
      - HAS_AMI
      - NOT_ENROLLED_IN_CONFLICTING_PROGRAM
      - PARTICIPATING
      - HAS_MARKET_REGISTRATION
      - NO_MISSING_FIELDS
      - GENERATOR
      - ADDRESS
      - HAS_NOMINATIONS
      - HAS_BIDDING_STRATEGY
      - IS_ELIGIBLE
      - IS_ASSIGNED_TO_A_RESOURCE
      - MEETS_EXTRA_PROGRAM_REQUIREMENTS
      example: IS_AUTHORIZED
      type: string
    DispatchOption:
      description: Dispatch strategy used in ConnectedSolutions.
      enum:
      - DAILY
      - TARGETED
      type: string
    DeviceType:
      description: Type of device on premise
      enum:
      - BATTERY
      - GENERATOR
      - EV
      - EV_CHARGER
      - BIDIRECTIONAL_EV_CHARGER
      - SMART_THERMOSTAT
      - AIR_CONDITIONER
      - HEAT_PUMP
      example: BATTERY
      type: string
    FuelType:
      description: The fuel source for a generator.
      enum:
      - DIESEL
      - NATURAL_GAS
      - DUAL_FUEL
      - CO_GEN
      - ENERGY_STORAGE
      - OTHER
      type: string
    NemType:
      description: Is the battery under NEM2 or NEM3 rules
      enum:
      - NEM2
      - NEM3
      type: string
    customer_baseline_load_verification_methodology:
      description: Choice of the Customer Baseline Load (CBL) verification methodology
        that will be used to calculate load reduction.
      enum:
      - AVERAGE_DAY
      - WEATHER_ADJUSTED
      type: string
    company_type:
      description: Required for customers enrolling in PSEGLI CSRP/DLRP
      enum:
      - INDIVIDUAL_OR_SOLE_PROPRIETOR
      - LIMITED_LIABILITY_COMPANY
      - PARTNERSHIP
      - CORPORATION
      - OTHER
      - EXEMPT_PAYEE
      type: string
    utility:
      description: The name of the Investor Owned Utility or Publicly Owned Utility
        whose territory the customer is in.
      enum:
      - PGE
      - SCE
      - SDGE
      - SMUD
      - LADWP
      - SVP
      - CECONY
      - ORU
      - PSEGLI
      - NYS
      - RIE
      - EVERSOURCE
      - NATGRID
      - UNITIL
      - PPL
      - CAPELIGHT
      - UPLIGHT
      - UNITED_ILLUMINATED
      - SMT
      - AEP_CENTRAL
      - AEP_NORTH
      - NUECES_ELECTRIC
      - ONCOR
      - CENTERPOINT
      - ENTERGY_GULF
      - SWEPCO
      - TNMP
      - DEMO
      - DEMO2
      - LEAP_TEST_CAISO
      - LEAP_TEST_NYISO
      - COMED
      - BGE
      - PECO
      - METED
      - PENELEC
      - PSEG
      - DOMINION
      - WESTPENN
      - PENNPOWER
      - PEPCO
      - PJM_DEMO
      - OTHER
      - NES
      - MLGW
      - KUB
      - NPU
      - MTEMC
      - PRECC
      - HSVU
      - SRP
      - PSE
      - TVA
      example: PGE
      type: string
    Customer_billing:
      description: Billing address for the customer.
      example:
        street_1: 132 My Billing Street
        street_2: Apartment 32
        postal_code: "90210"
        city: Los Angeles
        state_or_province_code: CA
        country_code: US
      properties:
        street_1:
          description: "Physical street of the billing address. If you need to provide\
            \ extensions like apartment or unit number, please add those to the 'street2'\
            \ field."
          example: 132 My Billing Street
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-\\\\|]{1,128}$"
          type: string
        street_2:
          description: Provide extensions like apartment or unit number here if needed.
          example: Apartment 32
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-\\\\|]{1,128}$"
          type: string
        postal_code:
          description: Billing address postal code.
          example: "90210"
          pattern: "^[0-9]{5}(?:-[0-9]{4})?$"
          type: string
        city:
          description: Billing address city.
          example: Los Angeles
          maxLength: 128
          minLength: 1
          pattern: "^[’'+#\"@()/&.,;\\sA-Za-zÀ-ɏḀ-ỿ0-9\\-]{1,128}$"
          type: string
        state_or_province_code:
          description: Billing address state or province code.
          example: CA
          maxLength: 2
          minLength: 2
          type: string
        country_code:
          default: US
          description: ISO 3166-1 alpha-2 country code of the billing address country.
            Defaults to US.
          example: US
          maxLength: 2
          minLength: 2
          type: string
      required:
      - city
      - country_code
      - postal_code
      - state_or_province_code
      - street_1
      type: object
    ReadUtility_utility:
      allOf:
      - $ref: "#/components/schemas/CommonUtility"
      - properties:
          bill_service_agreement_number:
            description: The Bill Service Agreement Number can be found on the customer’s
              bills and is the number that the customer would use to interact with
              the utility. This number may be called a different name by the utility.
              Use the table below to determine what it’s called and where to find
              it on the customer’s bill. See https://support.leap.energy/support/solutions/articles/73000524967--ca-what-s-the-difference-between-the-leap-meter-id-bill-service-agreement-number-bill-customer-ac
            type: string
          bill_customer_account_number:
            description: "The Bill Customer Account Number represents the customer\
              \ account, which may have multiple service agreements open with the\
              \ utility. See https://support.leap.energy/support/solutions/articles/73000524967--ca-what-s-the-difference-between-the-leap-meter-id-bill-service-agreement-number-bill-customer-ac"
            type: string
        type: object
      example:
        utility_name: PGE
        load_serving_entity: PGE
        electric_service_account_number: 12243243-121
        tariff: tariff code
        voltage: '>= 600 V'
        utility_meter_serial_number: utility-meter-serial-number
        bill_service_agreement_number: bill_service_agreement_number
        bill_customer_account_number: bill_customer_account_number
    AuditInfo_audit:
      example:
        created_by: PARTNER
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
      properties:
        created_by:
          description: Which entity created the meter
          enum:
          - PARTNER
          - LEAP
          - UTILITY
          type: string
        created_at:
          description: When the meter was created
          format: date-time
          type: string
        updated_at:
          description: When the meter was last updated
          format: date-time
          type: string
  securitySchemes:
    Bearer:
      scheme: bearer
      type: http
