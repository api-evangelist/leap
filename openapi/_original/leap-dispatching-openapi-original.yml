    SearchMeterDispatchEvent:
      description: |
        Aggregates timeslot dispatches per meter. Previously stored dispatches might be updated so when dealing with a dispatch timeslot that has the same meter_event_id as an existing one, the previously received dispatch has to be updated with the new field values.
      properties:
        meter_id:
          description: Id of the meter that received dispatches from the market
          format: uuid
          type: string
        partner_reference:
          description: The partner-supplied reference ID to help identify the customer
            or site that a Leap meter correlates to a partner’s internal systems.
          type: string
        timeslots:
          description: List with timeslots and quantities that contains dispatches
            for this meter
          items:
            $ref: "#/components/schemas/SearchMeterDispatchEventTimeslot"
          minItems: 1
          type: array
      required:
      - meter_id
      - timeslots
      type: object
    SearchMeterDispatchEventTimeslot:
      allOf:
      - properties:
          meter_event_id:
            description: Unique identifier of the dispatch event
            format: uuid
            type: string
          communication_test:
            description: Indicates whether the dispatch is a communication test.
            type: boolean
        type: object
      - $ref: "#/components/schemas/BaseDispatchEventTimeslot"
      required:
      - meter_event_id
      x-all-of-name: SearchMeterDispatchEventTimeslot
    BaseDispatchEventTimeslot:
      description: A single dispatch interval that describes all aspects of the dispatch.
      properties:
        start_time:
          description: Start time of dispatch
          example: 2021-09-14T22:00:00Z
          format: date-time
          type: string
        end_time:
          description: End time of dispatch
          example: 2021-09-14T23:00:00Z
          format: date-time
          type: string
        cancelled:
          description: |
            \'true' if this event has been cancelled
          type: boolean
        energy_kw:
          description: The awarded kW for the dispatch. This represents the expected
            power in kW to be curtailed/exported for the duration of the event. If
            the value is 'null' partners should dispatch the maximum they can manage.
          example: 115
          format: double
          maximum: 100000
          minimum: 0.01
          type: number
        nomination_kw:
          description: The nomination in kW. It represents the commitment amount made
            to the market for this asset.
          example: 115
          format: double
          maximum: 100000
          minimum: 0.01
          type: number
        performance_compensation_cap:
          $ref: "#/components/schemas/PerformanceCompensationCap"
        priority:
          description: |
            The priority of the dispatch compared to other dispatches for the same meter. This value is meant to support partners in prioritizing dispatch events in same-day or overlapping scenarios, at times where the asset may not be able to perform across all events. Number 1 reflects the highest priority.
          maximum: 10
          minimum: 1
          type: integer
        is_voluntary:
          description: |
            Indicates whether the dispatch is voluntary or a commitment. Pay-for-performance events, with no energy commitment to achieve, are categorized as true. If a dispatch event constitutes a market or program commitment or carries partner penalties for non-performance, this is set to false.
          type: boolean
        dispatch_event_types:
          description: |
            Used for programs that have different compensation structures for different types of dispatch events. All programs with a single compensation structure for all events will be set to standard.
          items:
            $ref: "#/components/schemas/DispatchEventType"
          minItems: 1
          type: array
          uniqueItems: true
        programs:
          description: |
            Programs associated with the dispatch. This is a fixed list of values depending on your use-case and refers to the program(s) that the meters are enrolled in.
          items:
            $ref: "#/components/schemas/program_identifier"
          minItems: 1
          type: array
          uniqueItems: true
      required:
      - cancelled
      - dispatch_event_types
      - end_time
      - is_voluntary
      - performance_compensation_cap
      - priority
      - programs
      - start_time
      type: object
    PerformanceCompensationCap:
      description: |
        This field can be used to automate a dispatch response that is aligned with the event’s settlement structure, to capitalize on scenarios where over-performance is lucrative versus scenarios where over-performance is not compensated and best reserved for another event.<br/> - UpToNomination - If partners dispatch beyond their nomination value, they will not be compensated.<br/> - UpToSiteLoad - Partners will be compensated for dispatching up to a site load of 0 kW.<br/> - GridExportsAllowed - Partners will be compensated for dispatching beyond a site load of 0 kW, into negative site load.
      enum:
      - grid-exports-allowed
      - up-to-nomination
      - up-to-site-load
      type: string
      x-enum-varnames:
      - GRID_EXPORTS_ALLOWED
      - UP_TO_NOMINATION
      - UP_TO_SITE_LOAD
    DispatchEventType:
