          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - SERVICE_UNAVAILABLE
          - INTERNAL_SERVER_ERROR
          type: string
        message:
          type: string
        error_code:
          enum:
          - LEAP_DISPATCH_INTERNAL_ERROR_001
          - LEAP_DISPATCH_INTERNAL_ERROR_002
          - DISPATCH_INVALID_INPUT
          - DISPATCH_NO_ACCESS_TO_RESOURCE
          - DISPATCH_UNAUTHORIZED
