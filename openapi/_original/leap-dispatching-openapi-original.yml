components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request could not be parsed or is invalid
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unauthorized
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: No access to this resource
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    UnexpectedError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unexpected error
  schemas:
    BaseSearchDispatchEventRequest:
      description: |
        Search parameters for the search dispatches endpoints
      properties:
        start_date:
          description: Start datetime range to get dispatches for (inclusive)
          format: date-time
          type: string
        end_date:
          description: |
            End datetime range to get dispatches for (exclusive). End date must be max 31 days after the start date
          format: date-time
          type: string
        exclude_real_time_events:
          default: true
          description: "Exclude dispatches for CAISO 5 minute real time events in\
            \ the response. If empty, 5 min real time events are excluded"
          type: boolean
        exclude_voluntary_events:
          default: false
          description: "Exclude dispatches for voluntary events in the response. If\
            \ empty, all dispatches are returned"
          type: boolean
        page_token:
          description: |
            Token of the page to request. Max results per page is 500. Null to request a new batch of results
          format: uuid
          type: string
      required:
      - end_date
      - start_date
      type: object
    SearchMeterDispatchEventRequest:
      allOf:
      - properties:
          meter_event_ids:
            description: Meter event ids to get dispatches for
            items:
              format: uuid
              type: string
            minItems: 1
            type: array
            uniqueItems: true
          meter_ids:
            description: Meter ids to get dispatches for
            items:
              format: uuid
              type: string
            minItems: 1
            type: array
            uniqueItems: true
        type: object
      - $ref: "#/components/schemas/BaseSearchDispatchEventRequest"
      example:
        meter_ids:
        - 9d1a7aae-24e5-455f-91e9-e0f5f145f2ae
        meter_event_ids:
        - ac5ea4df-db45-4cb5-a0bf-a32677dac736
        - 242c3e24-43e6-4ad7-88b3-666cda21582b
        start_date: 2023-02-01T00:00:00.000Z
        end_date: 2023-02-14T23:59:00.000Z
      x-all-of-name: SearchMeterDispatchEventRequest
