      example:
        last_job_id: c09240ce-8942-4eaf-a642-1c728e8d61a3
        uploaded_file_path: /interval-data/devices-hvac-january-2024.72.csv
        current_file_path: /interval-data/failed/devices-hvac-january-2024.72.csv/devices-hvac-january-2024.72.csv
