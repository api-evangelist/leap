          format: uuid
          type: string
        uploaded_file_path:
          description: The file path as it has been uploaded to the Leap sftp server. This file will not be present after ingestion and will be moved to a folder based on the success of ingestion. On successful ingestion, this file will be moved to the `interval-data/accepted/[filename]` folder. On unsuccessful ingestion, the file will be moved to the `interval-data/failed/[filename]` folder.
          example: /interval-data/devices-hvac-january-2024.72.csv
          type: string
        current_file_path:
          description: The ingested file. This may not be the original location of the upload, as after ingestion this file will be moved to a folder according to the success of ingestion (see uploaded_file_path)
          example: /interval-data/failed/devices-hvac-january-2024.72.csv/devices-hvac-january-2024.72.csv
          type: string
        uploaded_at_date_time:
          description: The date the file was uploaded to the Leap SFTP server
          example: '2024-01-30T18:55:12Z'
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        feedback_csv_file_path:
          description: Path of the CSV on the Leap SFTP server that contains the summary of the ingestion of the file. Note that this field is only set when the file has been parsed.
          example: /interval-data/failed/devices-hvac-januari-2024.72.csv/c09240ce-8942-4eaf-a642-1c728e8d61a3.feedback
          type: string
        error_csv_file_path:
          description: Path of the CSV on the Leap SFTP server that contains the errors that occurred trying to ingest the file. Note that this value is only set when the `status` field is equal to `FAILED`. You can also get the errors through the API by using the `v1/jobs/interval-data-uploads/{job_id}` endpoint.
          example: /interval-data/failed/devices-hvac-januari-2024.72.csv/c09240ce-8942-4eaf-a642-1c728e8d61a3.errors.csv
          type: string
      required:
      - current_file_path
      - last_job_id
      - status
      - uploaded_at_date_time
      - uploaded_file_path
      type: object
