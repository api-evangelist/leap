  - NYISO
certifications:
  published: false
  evidence: No trust center, no SOC 2 / ISO 27001 / PCI / HIPAA / FedRAMP claim found on leap.energy,
    developer.leap.energy or via search. No `Compliance` pointer is emitted in apis.yml as a result.
